name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Check TOC and tree
        run: |
          set -euo pipefail
          test -f ForeverQuestPins.toc
          grep -qE '^## Interface: 16001' ForeverQuestPins.toc
          grep -qE '^## Version:' ForeverQuestPins.toc
          grep -qxF '## SavedVariables: ForeverQuestPinsDB, ForeverQuestPinsDB_Settings' ForeverQuestPins.toc
          grep -qxF '## SavedVariablesPerCharacter: ForeverQuestPinsCharDB, ForeverQuestPinsCharacterSettings' ForeverQuestPins.toc
          test -f MapPins.xml
          test -f Media/QuestAvailable.tga
          test -f Database/ForeverQuests.lua
          test -f Database/Metadata.lua
          test -f Database/QuestTagCorrections.lua
          test -f LICENSE
          test -f ATTRIBUTION.md
          test -f README.md
          test -f CHANGELOG.md
          test -f RELEASE_NOTES.md
          test -f VERSION
          test -f docs/DEVELOPMENT.md
          test -f go.mod
          test -f cmd/fqp/main.go
          go run ./cmd/fqp release validate-notes \
            --version "$(tr -d '[:space:]' < VERSION)"
          grep -qE '^## X-Website:' ForeverQuestPins.toc
          grep -qE '^## X-Issues:' ForeverQuestPins.toc

      - name: Go tests
        run: go test ./...

      - name: Detect Questie data or generator changes
        id: questie_changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if [[ ! "$BASE_SHA" =~ ^0{40}$ ]] && git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- Database/ cmd/fqp/ internal/questdb/ internal/questiedb/ internal/questiepolicy/; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate automated release intent
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          QUEST_DATA_CHANGED=false
          if ! git diff -I '^-- Generated by ' --quiet "$BASE_SHA" HEAD -- Database/ForeverQuests.lua; then
            QUEST_DATA_CHANGED=true
          fi
          PREVIOUS_INTERFACE="$(git show "${BASE_SHA}:ForeverQuestPins.toc" | sed -n 's/^## Interface: //p')"
          CURRENT_INTERFACE="$(sed -n 's/^## Interface: //p' ForeverQuestPins.toc)"
          if [[ "$QUEST_DATA_CHANGED" == false && "$PREVIOUS_INTERFACE" == "$CURRENT_INTERFACE" ]]; then
            exit 0
          fi
          PREVIOUS_VERSION="$(git show "${BASE_SHA}:VERSION" | tr -d '[:space:]')"
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          go run ./cmd/fqp release validate \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$CURRENT_VERSION" \
            --release-content-changed
          grep -qF "## ${CURRENT_VERSION} " CHANGELOG.md

      - name: Read pinned inputs
        if: steps.questie_changes.outputs.required == 'true'
        id: pins
        run: |
          set -euo pipefail
          ARTIFACT_SHA="$(sed -n 's/^[[:space:]]*artifactSHA256 = "\([0-9a-f][0-9a-f]*\)".*/\1/p' Database/Metadata.lua)"
          POLICY_SHA="$(sed -n 's/^[[:space:]]*policyCommit = "\([0-9a-f][0-9a-f]*\)".*/\1/p' Database/Metadata.lua)"
          test -n "$ARTIFACT_SHA"
          test -n "$POLICY_SHA"
          {
            echo "artifact=$ARTIFACT_SHA"
            echo "policy=$POLICY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Validate pinned QuestieDB artifact
        if: steps.questie_changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache
          RELEASE_JSON="$(curl --fail --silent --show-error --location \
            https://api.github.com/repos/Questie/QuestieDB/releases/tags/preview)"
          ASSET_COUNT="$(jq '[.assets[] | select(.name | test("^QuestieDB-.+-Forever[.]zip$"))] | length' <<<"$RELEASE_JSON")"
          if [[ "$ASSET_COUNT" != 1 ]]; then
            echo "Expected exactly one QuestieDB-<version>-Forever.zip asset in QuestieDB release 'preview', found $ASSET_COUNT." >&2
            exit 1
          fi
          ASSET_URL="$(jq -r '[.assets[] | select(.name | test("^QuestieDB-.+-Forever[.]zip$"))][0].browser_download_url // empty' <<<"$RELEASE_JSON")"
          if [[ -z "$ASSET_URL" ]]; then
            echo "QuestieDB release 'preview' has a matching QuestieDB-<version>-Forever.zip asset without a download URL." >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            "$ASSET_URL" \
            --output .cache/QuestieDB-Forever.zip
          ACTUAL_SHA="$(sha256sum .cache/QuestieDB-Forever.zip | cut -d' ' -f1)"
          if [[ "$ACTUAL_SHA" != "${{ steps.pins.outputs.artifact }}" ]]; then
            echo "QuestieDB preview has moved since this database was generated (expected ${{ steps.pins.outputs.artifact }}, found $ACTUAL_SHA). Run the Update QuestieDB database workflow manually to regenerate the data before merging this PR." >&2
            exit 1
          fi

      - name: Checkout Questie policy at pinned commit
        if: steps.questie_changes.outputs.required == 'true'
        uses: actions/checkout@v7
        with:
          repository: Questie/Questie
          ref: ${{ steps.pins.outputs.policy }}
          path: .cache/Questie
          sparse-checkout: |
            Database/Corrections/Holidays/quests
            Database/Corrections/questTagInfoCorrections.lua
          sparse-checkout-cone-mode: false

      - name: Regenerate database and fail on drift
        if: steps.questie_changes.outputs.required == 'true'
        run: |
          set -euo pipefail
          go run ./cmd/fqp build-db \
            --questiedb .cache/QuestieDB-Forever.zip \
            --questiedb-sha "${{ steps.pins.outputs.artifact }}" \
            --questiedb-ref preview \
            --questie .cache/Questie \
            --questie-sha "${{ steps.pins.outputs.policy }}" \
            --out Database
          git diff --exit-code -- \
            Database/ForeverQuests.lua \
            Database/Metadata.lua \
            Database/QuestTagCorrections.lua \
            Database/build_report.json

      - name: Dry-run package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
