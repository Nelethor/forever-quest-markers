name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Check TOC and tree
        run: |
          set -euo pipefail
          test -f ForeverQuestPins.toc
          grep -qE '^## Interface: 16001' ForeverQuestPins.toc
          grep -qE '^## Version:' ForeverQuestPins.toc
          grep -qxF '## SavedVariables: ForeverQuestPinsDB, ForeverQuestPinsDB_Settings' ForeverQuestPins.toc
          grep -qxF '## SavedVariablesPerCharacter: ForeverQuestPinsCharDB, ForeverQuestPinsCharacterSettings' ForeverQuestPins.toc
          test -f MapPins.xml
          test -f Media/QuestAvailable.tga
          test -f Database/ForeverQuests.lua
          test -f Database/Metadata.lua
          test -f Database/QuestTagCorrections.lua
          test -f Database/EventPolicy.lua
          test -f LICENSE
          test -f ATTRIBUTION.md
          test -f README.md
          test -f CHANGELOG.md
          test -f RELEASE_NOTES.md
          test -f VERSION
          test -f docs/DEVELOPMENT.md
          test -f go.mod
          test -f cmd/fqp/main.go
          go run ./cmd/fqp release validate-notes \
            --version "$(tr -d '[:space:]' < VERSION)"
          grep -qE '^## X-Website:' ForeverQuestPins.toc
          grep -qE '^## X-Issues:' ForeverQuestPins.toc

      - name: Go tests
        run: go test ./...

      - name: Validate automated release intent
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          QUEST_DATA_CHANGED=false
          if ! git diff -I '^-- Generated by ' --quiet "$BASE_SHA" HEAD -- Database/ForeverQuests.lua Database/EventPolicy.lua; then
            QUEST_DATA_CHANGED=true
          fi
          PREVIOUS_INTERFACE="$(git show "${BASE_SHA}:ForeverQuestPins.toc" | sed -n 's/^## Interface: //p')"
          CURRENT_INTERFACE="$(sed -n 's/^## Interface: //p' ForeverQuestPins.toc)"
          if [[ "$QUEST_DATA_CHANGED" == false && "$PREVIOUS_INTERFACE" == "$CURRENT_INTERFACE" ]]; then
            exit 0
          fi
          PREVIOUS_VERSION="$(git show "${BASE_SHA}:VERSION" | tr -d '[:space:]')"
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          go run ./cmd/fqp release validate \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$CURRENT_VERSION" \
            --release-content-changed
          grep -qF "## ${CURRENT_VERSION} " CHANGELOG.md

      - name: Dry-run package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
